#Run Astro Check on all pull requests.
name: Check pull request for Astro Errors

on:
  #Set to workflow_dispatch to disable temporarily.
  workflow_dispatch:

  # Allows you to run this workflow manually from the Actions tab
  #pull_request:
  #  types:
  #    - opened
  #    - reopened
  #  branches:
  #    - "main"
  #    - "dev"

env:
  BUILD_PATH: "."
  NODE_VER: "24"
  GH_TOKEN: ${{ github.token }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  #Check the astro pull request
  checks:
    name: Check Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      #Prepare and restore cache for build repositories
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npm run" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER}}
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      #Build ASTRO
      - name: Install Modules
        run: ${{ steps.detect-package-manager.outputs.manager}} ${{ steps.detect-package-manager.outputs.command }}
      # Reuse Astro's optimized-image cache between runs (npm ci wipes node_modules, so restore after install)
      - name: Cache Astro optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/images/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-
      - name: Build Application
        run: ${{ steps.detect-package-manager.outputs.runner }} build
